name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "diagnostics/v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run diagnostics module tests
        working-directory: diagnostics
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Vet diagnostics module
        working-directory: diagnostics
        run: go vet ./...

      - name: Build
        run: make build
